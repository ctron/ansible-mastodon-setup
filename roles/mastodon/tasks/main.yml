---

- name: Check for existing Mastodon checkout
  stat:
    path: /home/mastodon/live/.git
  register: mastodon_checkout

- name: Determine whether this run is an upgrade
  set_fact:
    mastodon_is_upgrade: >-
      {{ (mastodon_upgrade
          if mastodon_upgrade is not none
          else mastodon_checkout.stat.exists) | bool }}

- name: Install pre-requisites
  import_tasks: pre-reqs.yml

- name: Create user
  import_tasks: user.yml

- name: Ruby
  import_tasks: ruby.yml

- name: Database
  import_tasks: database.yml

- name: NGINX
  import_tasks: nginx.yml

- name: Mastodon
  import_tasks: mastodon.yml

- name: Firewall
  import_tasks: firewall.yml
