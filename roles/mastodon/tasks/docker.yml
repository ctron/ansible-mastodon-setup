---

- name: Create Mastodon Compose directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ mastodon_compose_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ mastodon_public_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ mastodon_system_dir }}"
      owner: "{{ mastodon_container_uid }}"
      group: "{{ mastodon_container_gid }}"
      mode: "0755"
    - path: "{{ mastodon_backup_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ mastodon_postgres_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ mastodon_redis_dir }}"
      owner: "{{ mastodon_redis_uid }}"
      group: "{{ mastodon_redis_gid }}"
      mode: "0750"

- name: Render Mastodon environment
  template:
    src: env.production.j2
    dest: "{{ mastodon_compose_dir }}/.env.production"
    owner: root
    group: root
    mode: "0600"

- name: Render Mastodon Compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ mastodon_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
